<!Doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel='stylesheet' href='style.css'/>

    <title>Benison's Website</title>
</head>

<body>

    <main>

        <div class="container-1">

            <div class="col-left">

                <h1>Title Name 1</h1>
                <h3>Sub Title</h3>

                <section class="navButton">
                    <a href="#about"><button class="about-button">About</button></a> <br/>
                    <a href="#hobbies"><button class="hobbies-button">Hobbies</button></a> <br/>
                    <a href="#contact"><button class="contact-button">Contact</button></a>
                </section>

            </div>

            <div class="col-right">
                
                <img 
                    class="home-photo"
                    src="####" 
                    alt="Benison's Profile Photo"
                />

            </div>

        </div>

        <div id="about">

            <div class="row-top-about">
                <h2 class="about-title">Page's Title</h2>
            </div>
                
            <div class="row-bot-about">

                <div class="image-container-about">
                    <img class="about-photo" src="####" alt="About me">
                </div>

                <div class="paragraph">

                    <p class="paragraph-1">Paragraph</p>
                     <br/>
                    <p class="paragraph-2">Paragraph</p>
                    <br/>
                    <p class="paragraph-3">Paragraph</p>

                </div>

            </div>

        </div>

        <div id="hobbies">

            <div class="row-top-hobby">
                <h2 class="hobbies-title">Title</h2>
            </div>

            <div class="image-container-hobbies">
            
                <div class="hobby-running">
                    <img class="running-photo" src="####" alt="Running">
                    <p class="running-text">Text</p>
                </div>

                <div class="hobby-hiking">
                    <img class="hiking-photo" src="####" alt="Hiking">
                    <p class="hiking-text">Text</p>
                </div>

                <div class="hobby-guitar">
                    <img class="song-writing-photo" src="####" alt="Guitar">
                    <p class="song-writing-text">Text</p>
                </div>

                <div class="hobby-coding">
                    <img class="coding-photo" src="####" alt="Coding">
                    <p class="coding-text">Text</p>
                </div>

            </div>

            
        </div>

        <div id="contact">

            <div class="image-container-contact">
                <img class="contact-photo" src="####" alt="Family Photo">
            </div>

            <div class="row-bot-contact-title">
                    <h2 class="contact-title">Title</h2>
            </div>

            <div class="row-bot-contact-info">
                <div class="contact-info">
                    <div class="phone">
                        <p><b>Phone</b></p>
                        <p class="phone-number">Text</p>
                    </div>
                    <div class="email">
                        <p><b>Email</b></p>
                        <p class="email-address">Text</p>
                    </div>
                </div>
            </div>

        </div>
    
    </main>

</body>

<script src="script.js"></script>

</html>
